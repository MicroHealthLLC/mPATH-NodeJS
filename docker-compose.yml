version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    ports:
      - "8080:3000"
      - "8081:9000"
    environment:
      - NODE_ENV=development
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - DB_NAME=mpath
      - DB_USER=root
      - DB_PASSWORD=example
      - DB_HOST=mysql
      - DB_PORT=3306
      - PORT=9000
      - JWT_SECRET_KEY=yourjwtsecretkey
      - GOOGLE_MAP_KEY=''
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: mpath
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: