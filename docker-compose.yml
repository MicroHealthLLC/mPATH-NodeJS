version: "3.8"

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.client
    ports:
      - "8081:9000"
    environment:
      - NODE_ENV=development
      - VUE_APP_API_BASE_PATH=http://localhost:3000/api/v1
      - VUE_APP_Admin_PANEL_URL=http://localhost:3000
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_NAME=mpath
      - DB_USER=root
      - DB_PASSWORD=
      - DB_HOST=mysql
      - DB_PORT=3306
      - PORT=3000
      - JWT_SECRET_KEY=yourjwtsecretkey
      - GOOGLE_MAP_KEY=''
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: mpath
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
